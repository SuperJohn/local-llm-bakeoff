# Synthetic planner/calendar/tracker tools with deterministic fixtures. No real accounts.
system: >-
  You are a planning assistant. Today is Monday 2026-10-12; tomorrow is 2026-10-13.
  Use tools when needed; do not ask clarifying questions. When done, answer briefly.
tools:
  - {name: get_plan_blocks, description: List planner time blocks for a date, params: {date: {type: string, description: YYYY-MM-DD}}, required: [date]}
  - {name: move_block, description: Move a planner block to a new start time, params: {block_id: {type: string}, new_start: {type: string, description: "HH:MM 24h"}}, required: [block_id, new_start]}
  - {name: create_issue, description: Create a task-tracker issue, params: {title: {type: string}, priority: {type: integer, description: "1 urgent..4 low"}, due_date: {type: string, description: YYYY-MM-DD}}, required: [title]}
  - {name: get_events, description: List calendar events for a date, params: {date: {type: string, description: YYYY-MM-DD}}, required: [date]}
  - {name: get_weather, description: Get forecast for a city, params: {city: {type: string}}, required: [city]}
fixtures:
  get_plan_blocks:
    by: date
    values:
      "2026-10-13":
        - {id: b1, title: "Deep work: harness", start: "09:00", end: "11:00"}
        - {id: b2, title: Gym, start: "12:00", end: "13:00"}
        - {id: b3, title: Call the bank, start: "15:00", end: "15:30"}
  get_events:
    by: date
    values:
      "2026-10-13": [{title: Dentist, start: "09:30", end: "10:30"}]
      "2026-10-14": [{title: Team offsite, start: "11:30", end: "12:20"}]
  move_block: {echo: true, extra: {ok: true}}
  create_issue: {echo: true, extra: {id: TASK-99, url: "https://tracker.example/TASK-99"}}
  get_weather: {city: San Diego, high_f: 72, sky: sunny}
tasks:
  - id: planner_read
    prompt: What's on my planner tomorrow?
    expect: {select: [get_plan_blocks], args: [{tool: get_plan_blocks, args: {date: "2026-10-13"}}], final_contains: [deep work, harness]}
  - id: calendar_read
    prompt: Do I have any calendar events on Wednesday?
    expect: {select: [get_events], args: [{tool: get_events, args: {date: "2026-10-14"}}], final_contains: [offsite]}
  - id: create_urgent
    prompt: "Create an issue titled 'Call the bank about fees', urgent priority, due 2026-10-13."
    expect: {select: [create_issue], args: [{tool: create_issue, args: {title: bank, priority: 1, due_date: "2026-10-13"}}], final_contains: [task-99, created]}
  - id: move_gym
    prompt: Move my gym block tomorrow to 17:00.
    expect: {select: [get_plan_blocks, move_block], args: [{tool: move_block, args: {block_id: b2, new_start: "17:00"}}], final_contains: []}
  - id: resolve_overlap
    prompt: Tomorrow, check my calendar and if anything overlaps a planner block, move that block to start right after the event ends.
    expect: {select: [get_events, get_plan_blocks, move_block], args: [{tool: move_block, args: {block_id: b1, new_start: "10:30"}}], final_contains: []}
  - id: weather
    prompt: What's the weather in San Diego?
    expect: {select: [get_weather], args: [{tool: get_weather, args: {city: san diego}}], final_contains: ["72"]}
  - id: no_tool_math
    prompt: What's 17 times 23?
    expect: {no_tools: true, final_contains: ["391"]}
  - id: relative_due_date
    prompt: Make an issue to renew the library card by Wednesday, priority 2.
    expect: {select: [create_issue], args: [{tool: create_issue, args: {priority: 2, due_date: "2026-10-14"}}], final_contains: [task-99, created]}
  - id: multi_step
    prompt: "Look at tomorrow's planner and move the Call the bank block one hour earlier, then create a low-priority issue titled 'Follow up with the bank'."
    expect: {select: [move_block, create_issue], args: [{tool: move_block, args: {block_id: b3, new_start: "14:00"}}, {tool: create_issue, args: {title: follow up, priority: 4}}], final_contains: []}
  # --- expansion toward ~30 tasks (P2.1); not in the 2026-10-12 legacy run ---
  - id: weather_no_city_default
    prompt: Is it going to be sunny in San Diego tomorrow? Just yes or no.
    expect: {select: [get_weather], args: [{tool: get_weather, args: {city: san diego}}], final_contains: ["yes"]}
  - id: no_tool_chitchat
    prompt: Say hi in one word.
    expect: {no_tools: true, final_contains: ["hi", "hello"]}
  - id: count_blocks
    prompt: How many planner blocks do I have tomorrow?
    expect: {select: [get_plan_blocks], args: [{tool: get_plan_blocks, args: {date: "2026-10-13"}}], final_contains: ["3", "three"]}
  # --- expansion to 30 (2026-10-15) ---
  - id: planner_end_time
    prompt: What time does my deep work block end tomorrow?
    expect: {select: [get_plan_blocks], args: [{tool: get_plan_blocks, args: {date: "2026-10-13"}}], final_contains: ["11:00", "11 am", "11am"]}
  - id: calendar_today_empty
    prompt: Any calendar events today?
    expect: {select: [get_events], args: [{tool: get_events, args: {date: "2026-10-12"}}], final_contains: ["no ", "none", "nothing", "free", "don't"]}
  - id: dentist_time
    prompt: When is my dentist appointment tomorrow?
    expect: {select: [get_events], args: [{tool: get_events, args: {date: "2026-10-13"}}], final_contains: ["9:30", "09:30"]}
  - id: offsite_end
    prompt: What time does the team offsite end on Wednesday?
    expect: {select: [get_events], args: [{tool: get_events, args: {date: "2026-10-14"}}], final_contains: ["12:20"]}
  - id: create_low_priority
    prompt: "Create a low priority issue titled 'Clean the garage'."
    expect: {select: [create_issue], args: [{tool: create_issue, args: {title: garage, priority: 4}}], final_contains: [task-99, created]}
  - id: create_due_tomorrow
    prompt: "Add an issue 'Submit expense report' due tomorrow."
    expect: {select: [create_issue], args: [{tool: create_issue, args: {title: expense, due_date: "2026-10-13"}}], final_contains: [task-99, created]}
  - id: create_high_priority
    prompt: "File an issue 'Fix the leaky faucet' with high priority (2)."
    expect: {select: [create_issue], args: [{tool: create_issue, args: {title: faucet, priority: 2}}], final_contains: [task-99, created]}
  - id: move_by_id
    prompt: Move planner block b3 to 16:00.
    expect: {select: [move_block], args: [{tool: move_block, args: {block_id: b3, new_start: "16:00"}}], final_contains: []}
  - id: move_deep_work_later
    prompt: Push tomorrow's deep work block two hours later.
    expect: {select: [get_plan_blocks, move_block], args: [{tool: move_block, args: {block_id: b1, new_start: "11:00"}}], final_contains: []}
  - id: weather_umbrella
    prompt: Should I bring an umbrella in San Diego?
    expect: {select: [get_weather], args: [{tool: get_weather, args: {city: san diego}}], final_contains: ["no", "sunny", "not"]}
  - id: weather_temp_math
    prompt: What's the high in San Diego, and how many degrees above 60F is that?
    expect: {select: [get_weather], args: [{tool: get_weather, args: {city: san diego}}], final_contains: ["12"]}
  - id: no_tool_capital
    prompt: What is the capital of France?
    expect: {no_tools: true, final_contains: ["paris"]}
  - id: no_tool_date_math
    prompt: Today is Monday. What day of the week is it in three days? One word.
    expect: {no_tools: true, final_contains: ["thursday"]}
  - id: no_tool_unit
    prompt: How many minutes are in 2.5 hours? Just the number.
    expect: {no_tools: true, final_contains: ["150"]}
  - id: gym_duration
    prompt: How long is my gym block tomorrow, in minutes?
    expect: {select: [get_plan_blocks], args: [{tool: get_plan_blocks, args: {date: "2026-10-13"}}], final_contains: ["60", "one hour", "1 hour"]}
  - id: overlap_check_only
    prompt: Does anything on my calendar tomorrow overlap a planner block? Don't change anything, just tell me which block.
    expect: {select: [get_events, get_plan_blocks], args: [], final_contains: ["deep work", "b1"]}
  - id: weather_then_issue
    prompt: "Check the San Diego weather; if it's sunny, create an issue titled 'Go for a run' for tomorrow."
    expect: {select: [get_weather, create_issue], args: [{tool: create_issue, args: {title: run, due_date: "2026-10-13"}}], final_contains: []}
  - id: events_two_days
    prompt: List my calendar events for tomorrow and Wednesday.
    expect: {select: [get_events], args: [{tool: get_events, args: {date: "2026-10-13"}}, {tool: get_events, args: {date: "2026-10-14"}}], final_contains: [dentist]}
